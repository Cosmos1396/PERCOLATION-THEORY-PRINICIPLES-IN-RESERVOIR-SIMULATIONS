name: EOR simulator validation

on:
  push:
    paths:
      - 'eor-conformance-simulator/**'
      - '.github/workflows/eor-simulator-validation.yml'
  pull_request:
    paths:
      - 'eor-conformance-simulator/**'
      - '.github/workflows/eor-simulator-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eor-conformance-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate published benchmark
        run: node validation/validate-benchmark.mjs
      - name: Validate finite-volume transport conservation
        run: node validation/validate-transport.mjs
      - name: Validate conservative production accounting
        run: node validation/validate-production-accounting.mjs
      - name: Validate coupled FV and production accounting
        run: node validation/validate-coupled-accounting.mjs
      - name: Validate coupled production timestep orchestration
        run: node validation/validate-coupled-step.mjs
      - name: Validate pore-volume run control
        run: node validation/validate-run-control.mjs
      - name: Validate adaptive flood-horizon runner
        run: node validation/validate-adaptive-runner.mjs
      - name: Validate same-geology scenario comparison
        run: node validation/validate-scenario-comparison.mjs
      - name: Validate model interpretation boundary
        run: node validation/validate-model-card.mjs
      - name: Validate application source and conservation diagnostics
        run: node validation/validate-app-source.mjs
